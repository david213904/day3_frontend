<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>장소 추천 에이전트</title>
  <style>
    :root{--bg:#f3f7fb;--card:#fff;--ink:#18232f;--sub:#6a7a89;--line:#e2e9f0;--blue:#2f80ed;--green:#27ae60;--orange:#f2994a}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh;
      font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    header{background:linear-gradient(135deg,#4facfe,#2f80ed 60%,#1c5fcf);color:#fff;padding:16px 18px;
      display:flex;align-items:center;gap:12px}
    header h1{margin:0;font-size:19px;flex:1}
    header a{color:#fff;font-size:13px;opacity:.9;text-decoration:none;border:1px solid rgba(255,255,255,.5);
      padding:5px 11px;border-radius:999px}
    #log{flex:1;overflow:auto;padding:18px 14px;max-width:820px;width:100%;margin:0 auto}
    .msg{max-width:88%;margin:10px 0;padding:11px 15px;border-radius:16px;line-height:1.65;font-size:15px;
      white-space:pre-wrap;word-break:break-word}
    .user{margin-left:auto;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
    .bot{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
    .bot a{color:var(--blue)}
    .hello{color:var(--sub);text-align:center;padding:26px 8px;line-height:1.8;font-size:14.5px}
    .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
    .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;
      font-size:13.5px;cursor:pointer;color:var(--ink)}
    .chip:hover{border-color:var(--blue);color:var(--blue)}
    .tool{margin:6px 0 2px;max-width:88%;font-size:12.5px;color:var(--sub);background:#eef6ff;border:1px solid #d6e8ff;
      border-radius:12px;padding:8px 12px}
    .tool b{color:var(--blue)} .tool code{background:#fff;border-radius:6px;padding:1px 6px;color:var(--ink)}
    .tool details{margin-top:4px} .tool summary{cursor:pointer}
    .tool pre{margin:6px 0 0;max-height:160px;overflow:auto;white-space:pre-wrap;font-size:11.5px;color:var(--ink)}
    .typing{color:var(--sub);font-size:13.5px;padding:6px 4px}
    form{display:flex;gap:8px;padding:12px 14px;max-width:820px;width:100%;margin:0 auto}
    textarea{flex:1;border:1px solid var(--line);border-radius:14px;padding:11px 14px;font:inherit;font-size:15px;
      resize:none;height:48px;background:#fff;color:var(--ink)}
    textarea:focus{outline:2px solid var(--blue);border-color:transparent}
    button.send{border:0;background:var(--blue);color:#fff;border-radius:14px;padding:0 20px;font-size:15px;
      font-weight:700;cursor:pointer}
    button.send:disabled{opacity:.5;cursor:default}
    .err{color:#b3261e;background:#fff4f2;border:1px solid #ffd2cb}
  </style>
</head>
<body>
  <header>
    <h1>🧭 장소 추천 에이전트</h1>
    <a href="/">← 미세먼지·날씨</a>
  </header>

  <div id="log">
    <div class="hello" id="hello">
      지금 시각과 장소 검색 도구를 직접 호출해서 추천해 드려요.<br>
      <small>(Gemini + 도구 호출 · 장소 데이터는 OpenStreetMap)</small>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <form id="f">
    <textarea id="q" placeholder="예: 지금 제주시 연동에서 갈 만한 카페 추천해줘" maxlength="500"></textarea>
    <button class="send" id="send">보내기</button>
  </form>

<script>
  const $ = id => document.getElementById(id);
  const history = [];            // 서버로 보내는 대화 기록 [{role, text}]
  let busy = false;

  const SAMPLES = [
    "지금 몇 시야? 제주시 연동 근처 카페 추천해줘",
    "오늘 저녁에 서울 홍대에서 밥 먹을 곳 추천해줘",
    "부산 해운대에서 구경할 만한 곳 알려줘",
  ];
  $("chips").innerHTML = SAMPLES.map(s => `<button type="button" class="chip">${s}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b => b.onclick = () => { $("q").value = b.textContent; $("f").requestSubmit(); });

  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  // 답변 안의 https 링크를 클릭 가능하게 (안전하게 이스케이프한 뒤 변환)
  const linkify = s => esc(s).replace(/(https?:\/\/[^\s)<]+)/g, '<a href="$1" target="_blank" rel="noopener">지도 보기</a>');

  function add(cls, html) {
    const d = document.createElement("div");
    d.className = cls; d.innerHTML = html;
    $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
    return d;
  }

  function showSteps(steps) {
    (steps || []).forEach(s => {
      const label = s.tool === "get_current_datetime" ? "🕒 현재 시각 확인" : "📍 장소 검색";
      add("tool", `<b>🔧 도구 호출</b> · ${label} <code>${esc(s.tool)}(${esc(JSON.stringify(s.args))})</code>
        <details><summary>결과 보기</summary><pre>${esc(JSON.stringify(s.result, null, 2))}</pre></details>`);
    });
  }

  $("f").onsubmit = async e => {
    e.preventDefault();
    const text = $("q").value.trim();
    if (!text || busy) return;
    busy = true; $("send").disabled = true; $("q").value = "";
    $("hello") && $("hello").remove();
    add("msg user", esc(text));
    history.push({role: "user", text});
    const wait = add("typing", "🤔 생각하고 도구를 호출하는 중…");
    try {
      const r = await fetch("/api/agent", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({messages: history})});
      const d = await r.json().catch(() => ({}));
      wait.remove();
      showSteps(d.steps);
      if (!r.ok) { add("msg bot err", esc(d.error || "오류 HTTP " + r.status)); history.pop(); }
      else { add("msg bot", linkify(d.answer)); history.push({role: "model", text: d.answer}); }
    } catch (err) {
      wait.remove(); history.pop();
      add("msg bot err", "서버에 연결하지 못했어요: " + esc(err.message));
    }
    busy = false; $("send").disabled = false; $("q").focus();
  };
  $("q").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("f").requestSubmit(); }
  });
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>제주 미세먼지</title>
  <style>
    :root{
      --bg:#f3f7fb; --card:#fff; --ink:#18232f; --sub:#6a7a89; --line:#e2e9f0;
      --g1:#2f80ed; --g2:#27ae60; --g3:#f2994a; --g4:#eb5757; --gx:#b4bfca;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
      background:var(--bg);color:var(--ink)}
    header{background:linear-gradient(135deg,#4facfe,#2f80ed 55%,#1c5fcf);color:#fff;
      padding:40px 20px 70px;text-align:center}
    header h1{margin:0 0 8px;font-size:clamp(26px,5vw,36px);letter-spacing:-.5px}
    header p{margin:0;opacity:.92;font-size:14.5px}
    main{max-width:1040px;margin:-44px auto 50px;padding:0 16px}

    .summary{background:var(--card);border:1px solid var(--line);border-radius:20px;
      padding:20px;box-shadow:0 8px 24px rgba(20,60,120,.08);
      display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));text-align:center}
    .summary .k{font-size:12.5px;color:var(--sub);margin-bottom:6px}
    .summary .v{font-size:30px;font-weight:800}
    .summary .v small{font-size:13px;font-weight:600;color:var(--sub);margin-left:3px}
    .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;
      font-weight:700;color:#fff}
    .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 2px 0}
    .chip{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:999px;
      font-size:13.5px;cursor:pointer;color:var(--ink);transition:.15s}
    .chip.on{background:var(--g1);border-color:var(--g1);color:#fff}
    .btn{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:10px;
      padding:7px 14px;font-size:13px;cursor:pointer}
    .btn:hover{border-color:var(--g1);color:var(--g1)}

    .grid{display:grid;gap:14px;margin-top:16px;
      grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
      padding:18px;position:relative;overflow:hidden;transition:.18s}
    .card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(20,60,120,.12)}
    .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;
      background:var(--c,var(--gx))}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .name{font-weight:800;font-size:17px}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .m{background:#f7fafc;border-radius:12px;padding:10px 12px}
    .m .l{font-size:12px;color:var(--sub)}
    .m .n{font-size:26px;font-weight:800;line-height:1.2}
    .m .n small{font-size:11px;font-weight:600;color:var(--sub);margin-left:2px}
    .bar{height:6px;border-radius:6px;background:#e8eef4;margin-top:6px;overflow:hidden}
    .bar i{display:block;height:100%;border-radius:6px}
    .sub{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
    .fc{margin-top:12px;padding:10px 12px;background:#fff8ee;border-radius:12px}
    .fl{font-size:12.5px}
    .tr{margin-left:6px;font-size:11.5px;font-weight:700;color:var(--sub)}
    .tr.up{color:var(--g4)} .tr.down{color:var(--g1)}
    .spark{width:100%;height:44px;margin-top:6px;display:block}
    .fs{font-size:10.5px;color:var(--sub);margin-top:2px}
    .time{margin-top:10px;font-size:11.5px;color:var(--sub)}
    .state{text-align:center;color:var(--sub);padding:60px 0}
    .err{background:#fff4f2;border:1px solid #ffd2cb;color:#b3261e;border-radius:14px;
      padding:18px;margin-top:18px;line-height:1.6}
    .err code{background:#ffe6e1;padding:1px 6px;border-radius:6px}
    footer{text-align:center;color:var(--sub);font-size:12px;padding:0 0 30px}

    /* 지도 + 상세 */
    .mapwrap{display:grid;gap:14px;margin-top:18px;grid-template-columns:1fr}
    @media(min-width:860px){.mapwrap{grid-template-columns:1.6fr 1fr}}
    #map{height:430px;border-radius:20px;border:1px solid var(--line);
      box-shadow:0 8px 24px rgba(20,60,120,.08);z-index:0}
    #detail .hint{background:var(--card);border:1px dashed var(--line);border-radius:18px;
      padding:40px 18px;text-align:center;color:var(--sub);line-height:1.8}
    #detail .card:hover{transform:none;box-shadow:none}
    .pin{min-width:38px;height:38px;padding:0 6px;border-radius:19px;color:#fff;font-weight:800;
      font-size:14px;display:grid;place-items:center;border:3px solid #fff;
      box-shadow:0 3px 10px rgba(0,0,0,.35);transition:.15s;white-space:nowrap}
    .pin.sel{transform:scale(1.25);border-color:#18232f}
    .pin small{font-size:10px;font-weight:600;margin-left:2px;opacity:.9}
    .lbl{background:#fff;border:1px solid var(--line);border-radius:8px;font-weight:700;
      padding:2px 7px;font-size:12px;color:var(--ink);box-shadow:none}
    /* 날씨 (Open-Meteo) */
    .weather{margin-top:18px;background:linear-gradient(135deg,#ffffff,#eef6ff);border:1px solid var(--line);
      border-radius:20px;padding:18px 20px;box-shadow:0 8px 24px rgba(20,60,120,.08)}
    .wx-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:12px}
    .wx-head b{font-size:15px} .wx-head span{font-size:12px;color:var(--sub)}
    .wx-main{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
    .wx-icon{font-size:56px;line-height:1}
    .wx-temp{font-size:44px;font-weight:800;line-height:1}
    .wx-temp small{font-size:18px;color:var(--sub);font-weight:600}
    .wx-desc{color:var(--sub);font-size:14px;margin-top:4px}
    .wx-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));flex:1;min-width:260px}
    .wx-grid div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
    .wx-grid .l{font-size:11.5px;color:var(--sub)} .wx-grid .v{font-size:17px;font-weight:700}
    .wx-hours{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:2px}
    .wx-hours div{flex:0 0 auto;min-width:64px;text-align:center;background:#fff;border:1px solid var(--line);
      border-radius:12px;padding:7px 6px;font-size:12px;color:var(--sub)}
    .wx-hours b{display:block;font-size:15px;color:var(--ink);margin:2px 0}
    .wxbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;position:relative}
    .sbox{position:relative;flex:1;min-width:220px;max-width:420px}
    .sbox input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;
      font:inherit;font-size:14px;background:#fff;color:var(--ink)}
    .sbox input:focus{outline:2px solid var(--g1);border-color:transparent}
    #sg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);
      border-radius:12px;box-shadow:0 10px 26px rgba(20,60,120,.18);z-index:1000;list-style:none;margin:0;padding:4px;
      max-height:300px;overflow:auto;display:none}
    #sg li{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:8px}
    #sg li:hover,#sg li.hl{background:#eef5ff}
    #sg li small{color:var(--sub);font-size:12px}
    #sg .note{cursor:default;color:var(--sub);font-size:12px;background:none!important}
    .natbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font-size:13.5px;cursor:pointer}
    .natbtn.on{background:var(--g1);border-color:var(--g1);color:#fff}
    .wpin{background:#fff;border:2px solid var(--g1);border-radius:14px;padding:3px 8px;font-weight:800;
      font-size:13px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.25);text-align:center;line-height:1.25}
    .wpin small{display:block;font-size:10.5px;font-weight:600;color:var(--sub)}
    .sp{font-size:30px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
    .card[data-st]{cursor:pointer}
    .go{margin-top:8px;font-size:11.5px;color:var(--g1)}
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
  <header>
    <h1>🌫️ 제주 미세먼지</h1>
    <p>한국환경공단 에어코리아 실시간 측정 정보</p>
  </header>

  <main>
    <section class="summary" id="summary"></section>
    <section class="weather">
      <div class="wxbar">
        <div class="sbox">
          <input id="q" type="search" autocomplete="off" placeholder="🔍 전국 지역 검색 (예: 서, 해운대, 수원)">
          <ul id="sg"></ul>
        </div>
        <button class="natbtn" id="natBtn">🇰🇷 전국 날씨 지도</button>
      </div>
      <div id="wxbody"><div class="state" style="padding:20px 0">날씨 불러오는 중…</div></div>
    </section>
    <section class="mapwrap">
      <div id="map"></div>
      <aside id="detail"><div class="hint">🗺️ 지도에서 <b>지역(원)</b>을 클릭하면<br>그 지역의 미세먼지를 보여 드려요.</div></aside>
    </section>
    <div class="tools" id="tools"></div>
    <div id="view" class="state">불러오는 중…</div>
  </main>

  <footer>API: <span id="base"></span> · <span id="dbstate"></span></footer>

  <script>
    // 배포할 때는 이 한 줄만 Railway 주소로 바꾼다
    const API_BASE = "https://day3-backend-production-665f5a6d.up.railway.app";
    document.getElementById("base").textContent = API_BASE;

    const $ = id => document.getElementById(id);
    const GRADE = {
      1: {t: "좋음", c: "var(--g1)"}, 2: {t: "보통", c: "var(--g2)"},
      3: {t: "나쁨", c: "var(--g3)"}, 4: {t: "매우나쁨", c: "var(--g4)"},
    };
    const g = n => GRADE[n] || {t: "점검중", c: "var(--gx)"};
    const fmt = v => v == null ? "-" : v;
    // 환경부 기준 최대치(막대 길이용): PM10 150, PM2.5 75
    const pct = (v, max) => v == null ? 0 : Math.min(100, Math.round(v / max * 100));

    let rows = [], forecast = {}, sortBy = "name";

    function summary() {
      const ok10 = rows.filter(r => r.pm10 != null), ok25 = rows.filter(r => r.pm25 != null);
      const avg = a => a.length ? Math.round(a.reduce((s, r) => s + r.v, 0) / a.length) : null;
      const a10 = avg(ok10.map(r => ({v: r.pm10}))), a25 = avg(ok25.map(r => ({v: r.pm25}))),
      worst = [...rows].filter(r => r.pm10 != null).sort((a, b) => b.pm10 - a.pm10)[0];
      const lv10 = a10 == null ? 0 : a10 <= 30 ? 1 : a10 <= 80 ? 2 : a10 <= 150 ? 3 : 4;
      const lv25 = a25 == null ? 0 : a25 <= 15 ? 1 : a25 <= 35 ? 2 : a25 <= 75 ? 3 : 4;
      $("summary").innerHTML = `
        <div><div class="k">미세먼지 평균 (PM10)</div>
          <div class="v" style="color:${g(lv10).c}">${fmt(a10)}<small>㎍/㎥</small></div>
          <span class="pill" style="background:${g(lv10).c}">${g(lv10).t}</span></div>
        <div><div class="k">초미세먼지 평균 (PM2.5)</div>
          <div class="v" style="color:${g(lv25).c}">${fmt(a25)}<small>㎍/㎥</small></div>
          <span class="pill" style="background:${g(lv25).c}">${g(lv25).t}</span></div>
        <div><div class="k">측정소</div><div class="v">${rows.length}<small>곳</small></div>
          <div class="k" style="margin:6px 0 0">${rows[0] ? rows[0].data_time + " 기준" : ""}</div></div>
        <div><div class="k">가장 높은 곳 (PM10)</div>
          <div class="v" style="font-size:22px">${worst ? worst.station_name : "-"}</div>
          <div class="k" style="margin:6px 0 0">${worst ? worst.pm10 + " ㎍/㎥" : ""}</div></div>`;
    }

    function tools() {
      const opts = [["name", "이름순"], ["pm10", "미세먼지 높은 순"], ["pm25", "초미세먼지 높은 순"]];
      $("tools").innerHTML = opts.map(([k, t]) =>
        `<button class="chip ${sortBy === k ? "on" : ""}" data-k="${k}">${t}</button>`).join("")
        + `<button class="btn" id="reload">↻ 새로고침</button>`;
      $("tools").querySelectorAll(".chip").forEach(b => b.onclick = () => { sortBy = b.dataset.k; tools(); cards(); });
      $("reload").onclick = load;
    }

    function cards() {
      const list = [...rows];
      if (sortBy === "name") list.sort((a, b) => a.station_name.localeCompare(b.station_name, "ko"));
      else list.sort((a, b) => (b[sortBy] ?? -1) - (a[sortBy] ?? -1));
      $("view").className = "grid";
      $("view").innerHTML = list.map(r =>
        `<article class="card" data-st="${r.station_name}" style="--c:${g(r.pm10_grade).c}">${cardBody(r)}
          ${COORDS[r.station_name] ? `<div class="go">📍 클릭하면 지도에서 보기</div>` : ""}</article>`).join("");
      $("view").querySelectorAll(".card[data-st]").forEach(el =>
        el.onclick = () => { select(el.dataset.st, true); $("map").scrollIntoView({behavior: "smooth", block: "center"}); });
    }

    // 카드 한 장의 내용 (목록과 지도 상세 패널에서 함께 사용)
    function cardBody(r) {
      const a = g(r.pm10_grade), b = g(r.pm25_grade);
      return `<div class="top"><span class="name">${r.station_name}</span>
            <span class="pill" style="background:${a.c}">${a.t}</span></div>
          <div class="two">
            <div class="m"><div class="l">미세먼지 PM10</div>
              <div class="n" style="color:${a.c}">${fmt(r.pm10)}<small>㎍/㎥</small></div>
              <div class="bar"><i style="width:${pct(r.pm10, 150)}%;background:${a.c}"></i></div></div>
            <div class="m"><div class="l">초미세 PM2.5</div>
              <div class="n" style="color:${b.c}">${fmt(r.pm25)}<small>㎍/㎥</small></div>
              <div class="bar"><i style="width:${pct(r.pm25, 75)}%;background:${b.c}"></i></div></div>
          </div>
          <div class="sub"><span>오존 ${fmt(r.o3)}</span><span>NO₂ ${fmt(r.no2)}</span>
            <span>CO ${fmt(r.co)}</span><span>SO₂ ${fmt(r.so2)}</span></div>
          ${forecastHtml(r.station_name)}
          <div class="time">🕒 ${r.data_time}</div>`;
    }

    // ───────── 실시간 날씨 (Open-Meteo, 무료·API 키 불필요) ─────────
    // WMO 날씨 코드 → [이모지, 설명]
    const WMO = {
      0: ["☀️", "맑음"], 1: ["🌤️", "대체로 맑음"], 2: ["⛅", "구름 조금"], 3: ["☁️", "흐림"],
      45: ["🌫️", "안개"], 48: ["🌫️", "서리 안개"],
      51: ["🌦️", "약한 이슬비"], 53: ["🌦️", "이슬비"], 55: ["🌧️", "강한 이슬비"],
      61: ["🌧️", "약한 비"], 63: ["🌧️", "비"], 65: ["🌧️", "강한 비"],
      66: ["🌧️", "어는 비"], 67: ["🌧️", "강한 어는 비"],
      71: ["🌨️", "약한 눈"], 73: ["🌨️", "눈"], 75: ["❄️", "강한 눈"], 77: ["🌨️", "싸락눈"],
      80: ["🌦️", "소나기"], 81: ["🌧️", "강한 소나기"], 82: ["⛈️", "매우 강한 소나기"],
      85: ["🌨️", "눈 소나기"], 86: ["🌨️", "강한 눈 소나기"],
      95: ["⛈️", "뇌우"], 96: ["⛈️", "우박 동반 뇌우"], 99: ["⛈️", "강한 우박 뇌우"],
    };
    const wmo = c => WMO[c] || ["🌡️", "알 수 없음"];
    const compass = deg => ["북", "북동", "동", "남동", "남", "남서", "서", "북서"][Math.round(deg / 45) % 8] + "풍";
    const JEJU_CITY = [33.4996, 126.5312];
    const wxCache = {};

    async function loadWeather(coord, label) {
      const key = coord.join(",");
      const box = $("wxbody");
      try {
        let d = wxCache[key] && Date.now() - wxCache[key].at < 600000 ? wxCache[key].d : null;
        if (!d) {
          const url = "https://api.open-meteo.com/v1/forecast?latitude=" + coord[0] + "&longitude=" + coord[1]
            + "&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m"
            + "&hourly=temperature_2m,precipitation_probability,weather_code&forecast_hours=7"
            + "&wind_speed_unit=ms&timezone=Asia%2FSeoul";
          const r = await fetch(url);
          if (!r.ok) throw new Error("HTTP " + r.status);
          d = await r.json();
          wxCache[key] = {at: Date.now(), d};
        }
        const c = d.current, [icon, desc] = wmo(c.weather_code), h = d.hourly;
        const hours = h.time.slice(1, 7).map((t, i) => {
          const k = i + 1, [ic] = wmo(h.weather_code[k]);
          return `<div>${t.slice(11, 16)}<b>${ic} ${Math.round(h.temperature_2m[k])}°</b>💧${h.precipitation_probability[k] ?? 0}%</div>`;
        }).join("");
        box.innerHTML = `
          <div class="wx-head"><b>🌤️ 현재 날씨 · ${label}</b>
            <span>${c.time.replace("T", " ")} 기준 · Open-Meteo</span></div>
          <div class="wx-main">
            <div><div class="wx-icon">${icon}</div></div>
            <div><div class="wx-temp">${Math.round(c.temperature_2m)}<small>°C</small></div>
              <div class="wx-desc">${desc} · 체감 ${Math.round(c.apparent_temperature)}°C</div></div>
            <div class="wx-grid">
              <div><div class="l">💧 습도</div><div class="v">${c.relative_humidity_2m}%</div></div>
              <div><div class="l">🌬️ 바람</div><div class="v">${c.wind_speed_10m} m/s</div>
                <div class="l">${compass(c.wind_direction_10m)}</div></div>
              <div><div class="l">☔ 강수량</div><div class="v">${c.precipitation} mm</div></div>
            </div></div>
          <div class="wx-hours">${hours}</div>`;
      } catch (e) {
        box.innerHTML = `<div class="state" style="padding:20px 0">날씨를 불러오지 못했습니다 (${e.message})</div>`;
      }
    }

    // ───────── 지도 (Leaflet + OpenStreetMap) ─────────
    // 측정소 위치는 동네 중심 근처의 대략적인 좌표입니다 (정밀 측정소 좌표 아님).
    const COORDS = {
      "제주항": [33.5170, 126.5320], "이도동": [33.4990, 126.5350], "연동": [33.4880, 126.4980],
      "노형로": [33.4850, 126.4730], "화북동": [33.5300, 126.5750], "조천읍": [33.5440, 126.6360],
      "애월읍": [33.4620, 126.3280], "한림읍": [33.4120, 126.2650], "고산리": [33.2935, 126.1630],
      "대정읍": [33.2240, 126.2530], "강정동": [33.2420, 126.4770], "동홍동": [33.2560, 126.5700],
      "남원읍": [33.2780, 126.7170], "성산읍": [33.4590, 126.9340],
    };
    let map = null, markers = {}, selected = null;

    function initMap() {
      if (map || !window.L) return;
      map = L.map("map", {scrollWheelZoom: false}).setView([33.38, 126.55], 9);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18, attribution: "© OpenStreetMap contributors"}).addTo(map);
      map.on("focus", () => map.scrollWheelZoom.enable());
      map.on("blur", () => map.scrollWheelZoom.disable());
    }

    function pinIcon(r, sel) {
      const a = g(r.pm10_grade);
      return L.divIcon({className: "", iconSize: null, iconAnchor: [20, 20],
        html: `<div class="pin ${sel ? "sel" : ""}" style="background:${a.c}">${fmt(r.pm10)}</div>`});
    }

    function drawMarkers() {
      initMap();
      if (natOn) return;   // 전국 날씨 지도를 보는 중이면 미세먼지 핀은 그리지 않는다
      if (!map) { $("map").innerHTML = `<div class="state">지도를 불러오지 못했습니다 (인터넷 연결 확인)</div>`; return; }
      Object.values(markers).forEach(m => m.remove());
      markers = {};
      rows.forEach(r => {
        const c = COORDS[r.station_name];
        if (!c) return;
        const m = L.marker(c, {icon: pinIcon(r, r.station_name === selected), title: r.station_name}).addTo(map);
        m.bindTooltip(r.station_name, {direction: "top", offset: [0, -18], className: "lbl"});
        m.on("click", () => select(r.station_name, false));
        markers[r.station_name] = m;
      });
      if (selected) select(selected, false);
    }

    function select(name, fly) {
      const r = rows.find(x => x.station_name === name);
      if (!r) return;
      selected = name;
      Object.entries(markers).forEach(([n, m]) =>
        m.setIcon(pinIcon(rows.find(x => x.station_name === n), n === name)));
      $("detail").innerHTML = `<article class="card" style="--c:${g(r.pm10_grade).c}">${cardBody(r)}</article>`;
      const c = COORDS[name];
      if (c && map) fly ? map.flyTo(c, 11, {duration: .8}) : map.panTo(c);
      if (c) loadWeather(c, name);   // 선택한 지역의 날씨로 바꾼다
    }

    // 예측 영역: 최근 기록(실선) + 선형회귀 예측(점선) 미니 그래프
    function forecastHtml(name) {
      const f = forecast[name];
      if (!f || !f.pm10) return `<div class="fc"><div class="fl">🔮 예측: 데이터를 모으는 중 (3개 이상 필요)</div></div>`;
      const hist = f.history.map(h => h.pm10).filter(v => v != null), nxt = f.pm10.next;
      const all = hist.concat(nxt), max = Math.max(...all, 1), min = Math.min(...all, 0);
      const W = 200, H = 44, step = W / Math.max(all.length - 1, 1);
      const P = (v, i) => `${(i * step).toFixed(1)},${(H - 4 - (v - min) / (max - min || 1) * (H - 8)).toFixed(1)}`;
      const solid = hist.map((v, i) => P(v, i)).join(" ");
      const dash = [hist[hist.length - 1], ...nxt].map((v, i) => P(v, hist.length - 1 + i)).join(" ");
      const up = f.pm10.slope_per_hour > 0.3, down = f.pm10.slope_per_hour < -0.3;
      const p25 = f.pm25 ? f.pm25.next[0] : null;
      return `<div class="fc">
        <div class="fl">🔮 1시간 뒤 예상 <b>PM10 ${nxt[0]}</b>${p25 != null ? ` · PM2.5 ${p25}` : ""}
          <span class="tr ${up ? "up" : down ? "down" : ""}">${up ? "▲ 상승" : down ? "▼ 하락" : "● 비슷"}</span></div>
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="spark">
          <polyline points="${solid}" fill="none" stroke="var(--g1)" stroke-width="2"/>
          <polyline points="${dash}" fill="none" stroke="var(--g3)" stroke-width="2" stroke-dasharray="4 3"/></svg>
        <div class="fs">최근 ${hist.length}개 기록 기반 선형회귀</div></div>`;
    }

    async function load() {
      $("view").className = "state"; $("view").textContent = "불러오는 중…";
      try {
        const r = await fetch(API_BASE + "/air");
        if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "HTTP " + r.status);
        const d = await r.json();
        rows = d.items;
        $("dbstate").textContent = d.saved_to_db ? "DB 저장됨 ✓" : "DB 저장 안 됨 (테이블 확인)";
        // 예측은 부가 기능: 실패해도 화면은 그대로 보여준다
        try {
          const fr = await fetch(API_BASE + "/air/forecast?hours=3");
          if (fr.ok) forecast = (await fr.json()).stations || {};
        } catch (_) { forecast = {}; }
        summary(); tools(); cards(); drawMarkers();
      } catch (e) {
        $("view").className = "";
        $("view").innerHTML = `<div class="err"><b>데이터를 불러오지 못했습니다.</b><br>
          backend 서버가 켜져 있는지 확인하세요 (<code>${API_BASE}</code>).<br>
          주소창이 <code>http://127.0.0.1:5000</code> 형태여야 합니다 (파일을 더블클릭해 열면 안 됩니다).<br>
          오류: ${e.message}</div>`;
      }
    }
    // ───────── 전국 지역 검색 (첫 글자 자동완성 + 한글→영문 변환 검색) ─────────
    // main:true 는 "전국 날씨 지도"에 표시되는 17개 시·도 대표 도시
    const CITIES = [
      {n: "서울", lat: 37.5665, lng: 126.9780, main: 1, p: "서울특별시"}, {n: "부산", lat: 35.1796, lng: 129.0756, main: 1, p: "부산광역시"},
      {n: "대구", lat: 35.8714, lng: 128.6014, main: 1, p: "대구광역시"}, {n: "인천", lat: 37.4563, lng: 126.7052, main: 1, p: "인천광역시"},
      {n: "광주", lat: 35.1595, lng: 126.8526, main: 1, p: "광주광역시"}, {n: "대전", lat: 36.3504, lng: 127.3845, main: 1, p: "대전광역시"},
      {n: "울산", lat: 35.5384, lng: 129.3114, main: 1, p: "울산광역시"}, {n: "세종", lat: 36.4800, lng: 127.2890, main: 1, p: "세종특별자치시"},
      {n: "수원", lat: 37.2636, lng: 127.0286, main: 1, p: "경기도", label: "경기·수원"}, {n: "춘천", lat: 37.8813, lng: 127.7298, main: 1, p: "강원특별자치도", label: "강원·춘천"},
      {n: "청주", lat: 36.6424, lng: 127.4890, main: 1, p: "충청북도", label: "충북·청주"}, {n: "홍성", lat: 36.6010, lng: 126.6608, main: 1, p: "충청남도", label: "충남·홍성"},
      {n: "전주", lat: 35.8242, lng: 127.1480, main: 1, p: "전북특별자치도", label: "전북·전주"}, {n: "무안", lat: 34.9900, lng: 126.4817, main: 1, p: "전라남도", label: "전남·무안"},
      {n: "안동", lat: 36.5684, lng: 128.7294, main: 1, p: "경상북도", label: "경북·안동"}, {n: "창원", lat: 35.2280, lng: 128.6811, main: 1, p: "경상남도", label: "경남·창원"},
      {n: "제주시", lat: 33.4996, lng: 126.5312, main: 1, p: "제주특별자치도", label: "제주"},
      {n: "서귀포", lat: 33.2541, lng: 126.5601, p: "제주특별자치도"}, {n: "성남", lat: 37.4200, lng: 127.1267, p: "경기도"},
      {n: "고양", lat: 37.6584, lng: 126.8320, p: "경기도"}, {n: "용인", lat: 37.2411, lng: 127.1776, p: "경기도"},
      {n: "부천", lat: 37.5034, lng: 126.7660, p: "경기도"}, {n: "안산", lat: 37.3219, lng: 126.8309, p: "경기도"},
      {n: "안양", lat: 37.3943, lng: 126.9568, p: "경기도"}, {n: "남양주", lat: 37.6360, lng: 127.2165, p: "경기도"},
      {n: "화성", lat: 37.1995, lng: 126.8312, p: "경기도"}, {n: "평택", lat: 36.9921, lng: 127.1129, p: "경기도"},
      {n: "의정부", lat: 37.7381, lng: 127.0337, p: "경기도"}, {n: "파주", lat: 37.7600, lng: 126.7800, p: "경기도"},
      {n: "시흥", lat: 37.3800, lng: 126.8030, p: "경기도"}, {n: "김포", lat: 37.6153, lng: 126.7156, p: "경기도"},
      {n: "광명", lat: 37.4786, lng: 126.8644, p: "경기도"}, {n: "강남", lat: 37.4979, lng: 127.0276, p: "서울특별시"},
      {n: "홍대", lat: 37.5563, lng: 126.9236, p: "서울특별시"}, {n: "해운대", lat: 35.1631, lng: 129.1636, p: "부산광역시"},
      {n: "원주", lat: 37.3422, lng: 127.9202, p: "강원특별자치도"}, {n: "강릉", lat: 37.7519, lng: 128.8761, p: "강원특별자치도"},
      {n: "속초", lat: 38.2070, lng: 128.5918, p: "강원특별자치도"}, {n: "동해", lat: 37.5247, lng: 129.1143, p: "강원특별자치도"},
      {n: "삼척", lat: 37.4500, lng: 129.1650, p: "강원특별자치도"}, {n: "충주", lat: 36.9910, lng: 127.9259, p: "충청북도"},
      {n: "제천", lat: 37.1326, lng: 128.1909, p: "충청북도"}, {n: "천안", lat: 36.8151, lng: 127.1139, p: "충청남도"},
      {n: "아산", lat: 36.7898, lng: 127.0019, p: "충청남도"}, {n: "공주", lat: 36.4465, lng: 127.1190, p: "충청남도"},
      {n: "서산", lat: 36.7845, lng: 126.4503, p: "충청남도"}, {n: "당진", lat: 36.8930, lng: 126.6290, p: "충청남도"},
      {n: "보령", lat: 36.3333, lng: 126.6128, p: "충청남도"}, {n: "군산", lat: 35.9676, lng: 126.7369, p: "전북특별자치도"},
      {n: "익산", lat: 35.9483, lng: 126.9577, p: "전북특별자치도"}, {n: "남원", lat: 35.4164, lng: 127.3904, p: "전북특별자치도"},
      {n: "목포", lat: 34.8118, lng: 126.3922, p: "전라남도"}, {n: "여수", lat: 34.7604, lng: 127.6622, p: "전라남도"},
      {n: "순천", lat: 34.9506, lng: 127.4872, p: "전라남도"}, {n: "광양", lat: 34.9407, lng: 127.6959, p: "전라남도"},
      {n: "나주", lat: 35.0160, lng: 126.7108, p: "전라남도"}, {n: "포항", lat: 36.0190, lng: 129.3435, p: "경상북도"},
      {n: "경주", lat: 35.8562, lng: 129.2247, p: "경상북도"}, {n: "구미", lat: 36.1195, lng: 128.3446, p: "경상북도"},
      {n: "김천", lat: 36.1398, lng: 128.1136, p: "경상북도"}, {n: "영주", lat: 36.8057, lng: 128.6239, p: "경상북도"},
      {n: "울릉", lat: 37.4844, lng: 130.9057, p: "경상북도"}, {n: "진주", lat: 35.1800, lng: 128.1076, p: "경상남도"},
      {n: "김해", lat: 35.2285, lng: 128.8894, p: "경상남도"}, {n: "양산", lat: 35.3350, lng: 129.0373, p: "경상남도"},
      {n: "거제", lat: 34.8806, lng: 128.6211, p: "경상남도"}, {n: "통영", lat: 34.8544, lng: 128.4331, p: "경상남도"},
      {n: "사천", lat: 35.0036, lng: 128.0640, p: "경상남도"}, {n: "밀양", lat: 35.5038, lng: 128.7466, p: "경상남도"},
    ];

    // 한글 → 영문 (국어의 로마자 표기법, 받침/연음 규칙은 단순화)
    const R_L = ["g","kk","n","d","tt","r","m","b","pp","s","ss","","j","jj","ch","k","t","p","h"];
    const R_V = ["a","ae","ya","yae","eo","e","yeo","ye","o","wa","wae","oe","yo","u","wo","we","wi","yu","eu","ui","i"];
    const R_T = ["","k","k","ks","n","nj","nh","t","l","lk","lm","lb","ls","lt","lp","lh","m","p","ps","t","t","ng","t","t","k","t","p","t"];
    function romanize(s) {
      let out = "";
      for (const ch of s) {
        const c = ch.charCodeAt(0) - 0xAC00;
        out += (c >= 0 && c <= 11171) ? R_L[Math.floor(c / 588)] + R_V[Math.floor((c % 588) / 28)] + R_T[c % 28] : ch;
      }
      return out.charAt(0).toUpperCase() + out.slice(1);
    }
    const hasHangul = s => /[가-힣]/.test(s);
    const stripSuffix = s => s.length >= 3 ? s.replace(/(특별시|광역시|시|군|구)$/, "") : s;

    async function geocode(name) {
      const u = "https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(name)
        + "&count=6&language=ko&countryCode=KR";
      const r = await fetch(u);
      if (!r.ok) return [];
      return ((await r.json()).results || []).map(x => ({
        n: x.name, lat: x.latitude, lng: x.longitude, p: [x.admin2, x.admin1].filter(Boolean).join(" ")}));
    }

    let searchMarker = null, sgItems = [], sgSeq = 0, sgTimer = null, hl = -1, usedRoman = "";

    function renderSg(extra) {
      const ul = $("sg");
      if (!sgItems.length && !extra) { ul.style.display = "none"; return; }
      ul.innerHTML = sgItems.map((c, i) =>
        `<li data-i="${i}" class="${i === hl ? "hl" : ""}"><span>${c.n}</span><small>${c.p || ""}</small></li>`).join("")
        + (extra ? `<li class="note">${extra}</li>` : "");
      ul.style.display = "block";
      ul.querySelectorAll("li[data-i]").forEach(li =>
        li.onmousedown = e => { e.preventDefault(); pickPlace(sgItems[+li.dataset.i]); });
    }

    function onType() {
      const q = $("q").value.trim();
      hl = -1;
      if (!q) { sgItems = []; renderSg(); return; }
      // 1) 내장 목록: 첫 글자부터 바로 자동완성
      const starts = CITIES.filter(c => c.n.startsWith(q) || (c.p || "").startsWith(q));
      const incl = CITIES.filter(c => !starts.includes(c) && c.n.includes(q));
      sgItems = [...starts, ...incl].slice(0, 7);
      renderSg();
      // 2) 2글자 이상이면 Open-Meteo 지명 검색 (한글로 안 나오면 영문으로 바꿔 다시 검색)
      clearTimeout(sgTimer);
      if (q.length < 2) return;
      const seq = ++sgSeq;
      sgTimer = setTimeout(async () => {
        try {
          const names = [q];
          usedRoman = "";
          if (hasHangul(q)) { usedRoman = romanize(stripSuffix(q)); names.push(usedRoman); }
          const found = (await Promise.all(names.map(geocode))).flat();
          if (seq !== sgSeq) return;           // 더 새로운 입력이 있으면 버림
          const seen = new Set(sgItems.map(c => c.lat.toFixed(2) + "," + c.lng.toFixed(2)));
          found.forEach(c => {
            const k = c.lat.toFixed(2) + "," + c.lng.toFixed(2);
            if (!seen.has(k)) { seen.add(k); sgItems.push(c); }
          });
          sgItems = sgItems.slice(0, 10);
          renderSg(usedRoman && found.length ? `🔤 한글 "${q}" → 영문 "${usedRoman}" 로도 검색함` : (!sgItems.length ? "검색 결과 없음" : ""));
        } catch (_) { renderSg(sgItems.length ? "" : "검색 실패 (인터넷 확인)"); }
      }, 350);
    }

    function pickPlace(c) {
      if (!c) return;
      $("q").value = c.n; $("sg").style.display = "none"; sgItems = [];
      loadWeather([c.lat, c.lng], c.n);
      if (!map) return;
      if (searchMarker) searchMarker.remove();
      searchMarker = L.marker([c.lat, c.lng], {title: c.n, icon: L.divIcon({className: "", iconSize: null,
        iconAnchor: [15, 30], html: '<div class="sp">📍</div>'})}).addTo(map);
      map.flyTo([c.lat, c.lng], natOn ? Math.max(map.getZoom(), 8) : 11, {duration: .8});
      $("map").scrollIntoView({behavior: "smooth", block: "center"});
    }

    $("q").addEventListener("input", onType);
    $("q").addEventListener("focus", onType);
    $("q").addEventListener("blur", () => setTimeout(() => $("sg").style.display = "none", 150));
    $("q").addEventListener("keydown", e => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        hl = Math.max(0, Math.min(sgItems.length - 1, hl + (e.key === "ArrowDown" ? 1 : -1)));
        renderSg();
      } else if (e.key === "Enter") {
        e.preventDefault();
        pickPlace(sgItems[hl >= 0 ? hl : 0]);
      }
    });

    // ───────── 전국 날씨 지도: 17개 시·도 날씨를 한 번의 호출로 ─────────
    let natOn = false, natLayer = null;
    $("natBtn").onclick = async () => {
      if (!map) return;
      natOn = !natOn;
      $("natBtn").classList.toggle("on", natOn);
      if (!natOn) {
        if (natLayer) { natLayer.remove(); natLayer = null; }
        drawMarkers(); map.setView([33.38, 126.55], 9);
        return;
      }
      Object.values(markers).forEach(m => m.remove());
      const mains = CITIES.filter(c => c.main);
      const url = "https://api.open-meteo.com/v1/forecast?latitude=" + mains.map(c => c.lat).join(",")
        + "&longitude=" + mains.map(c => c.lng).join(",")
        + "&current=temperature_2m,weather_code&timezone=Asia%2FSeoul";
      try {
        const r = await fetch(url);
        if (!r.ok) throw new Error("HTTP " + r.status);
        const arr = await r.json();
        natLayer = L.layerGroup().addTo(map);
        mains.forEach((c, i) => {
          const cur = arr[i].current, [ic] = wmo(cur.weather_code);
          L.marker([c.lat, c.lng], {title: c.n, icon: L.divIcon({className: "", iconSize: null, iconAnchor: [36, 22],
            html: `<div class="wpin">${ic} ${Math.round(cur.temperature_2m)}°<small>${c.label || c.n}</small></div>`})})
            .on("click", () => pickPlace(c)).addTo(natLayer);
        });
        map.fitBounds([[33.0, 125.9], [38.7, 130.3]]);
      } catch (e) {
        natOn = false; $("natBtn").classList.remove("on"); drawMarkers();
        alert("전국 날씨를 불러오지 못함: " + e.message);
      }
    };

    loadWeather(JEJU_CITY, "제주시");   // 처음에는 제주시 날씨 (미세먼지와 별개로 불러온다)
    load();
  </script>
